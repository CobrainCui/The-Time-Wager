name: Deploy to Aliyun BT Server

# 自动部署已于 2026-11-06 停用：不再随 push 触发，只能手动 Run workflow。
# 需要恢复自动部署时，把下面的 workflow_dispatch 换回 push: branches: [main]。
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Lint and build frontend
      run: |
        cd frontend
        npm ci
        npm run lint
        npm run build
        test -f dist/version.json
        grep -q 'app-build-id' dist/index.html
        cd dist
        zip -r ../../dist_upload.zip ./*

    - name: Test and build backend
      run: |
        cd server
        npm ci
        npm test
        zip -r ../server_upload.zip dist/* package.json package-lock.json .env.example gameInstruction

    - name: Copy files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "dist_upload.zip,server_upload.zip"
        target: "/root"
        overwrite: true

    - name: Execute SSH commands to deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          # 部署玩家前端（主域不暴露管理入口页）
          unzip -o /root/dist_upload.zip -d /www/wwwroot/guangyinduidu.com/
          rm -f /www/wwwroot/guangyinduidu.com/admin.html

          # 部署管理前端（子域根路径即管理入口）
          mkdir -p /www/wwwroot/admin.guangyinduidu.com
          unzip -o /root/dist_upload.zip -d /www/wwwroot/admin.guangyinduidu.com/
          cp -f /www/wwwroot/admin.guangyinduidu.com/admin.html /www/wwwroot/admin.guangyinduidu.com/index.html

          # 部署后端
          unzip -o /root/server_upload.zip -d /www/wwwroot/guangyinduidu.com/server/
          cd /www/wwwroot/guangyinduidu.com/server/
          npm ci --omit=dev
          # 确认 pm2 跑的是编译产物（勿指向源码 server/index.js）
          pm2 describe guangyin | grep -E "script path|exec cwd" || true
          pm2 restart guangyin

          # 咖啡功能：防止前端已部署、后端 dist 过旧
          grep -q coffeePurchasesThisRound /www/wwwroot/guangyinduidu.com/server/dist/network/broadcast.js
          grep -q performCoffee /www/wwwroot/guangyinduidu.com/server/dist/network/socketHandlers.js

          # 投资倒计时控场：前后端需同版本
          grep -q investmentTimerPausedAt /www/wwwroot/guangyinduidu.com/server/dist/network/broadcast.js
          grep -q adminInvestmentTimer /www/wwwroot/guangyinduidu.com/server/dist/network/socketHandlers.js
          grep -q adminInvestmentTimer /www/wwwroot/admin.guangyinduidu.com/assets/admin-*.js

          # 财富调整（给钱/扣钱）：前后端需同版本，避免旧 admin 包缺入口
          grep -q adminAdjustWealth /www/wwwroot/guangyinduidu.com/server/dist/network/socketHandlers.js
          grep -q pendingWealthAdjustments /www/wwwroot/guangyinduidu.com/server/dist/network/broadcast.js
          grep -q adminAdjustWealth /www/wwwroot/admin.guangyinduidu.com/assets/admin-*.js

          # 主持补发/收回手牌：前后端需同版本
          grep -q adminAdjustPlayerCard /www/wwwroot/guangyinduidu.com/server/dist/network/socketHandlers.js
          grep -q adminAdjustPlayerCard /www/wwwroot/admin.guangyinduidu.com/assets/admin-*.js
          grep -q '补发' /www/wwwroot/admin.guangyinduidu.com/assets/admin-*.js
          grep -q fetchTransactionHistory /www/wwwroot/guangyinduidu.com/server/dist/network/socketHandlers.js
          grep -q fetchTransactionHistory /www/wwwroot/admin.guangyinduidu.com/assets/admin-*.js
          grep -q viewAsPlayerId /www/wwwroot/guangyinduidu.com/server/dist/network/socketHandlers.js
          grep -q viewAsPlayerId /www/wwwroot/admin.guangyinduidu.com/assets/admin-*.js

          # 自助开局：等待房房主可设 AI 人数/难度并直接开局，终局可再来一局
          grep -q playerUpdateRoom /www/wwwroot/guangyinduidu.com/server/dist/network/socketHandlers.js
          grep -q playerStartGame /www/wwwroot/guangyinduidu.com/server/dist/network/socketHandlers.js
          grep -q playerRematch /www/wwwroot/guangyinduidu.com/server/dist/network/socketHandlers.js
          grep -rq playerStartGame /www/wwwroot/guangyinduidu.com/assets/
          grep -rq '开始一局' /www/wwwroot/guangyinduidu.com/assets/

          # 品牌名：光阴对弈（旧名不再出现在玩家入口）
          grep -q '光阴对弈' /www/wwwroot/guangyinduidu.com/index.html

          # 规则助手知识库（ruleAgent 运行时读取 dist/../../gameInstruction）
          test -f /www/wwwroot/guangyinduidu.com/server/gameInstruction/rules_framework.md

          # 管理子域入口必须指向最新 admin.html（含新 hash 资源）；禁缓存避免旧入口指到过期 hash
          test -f /www/wwwroot/admin.guangyinduidu.com/index.html
          grep -q 'admin-' /www/wwwroot/admin.guangyinduidu.com/index.html
          grep -q 'no-store' /www/wwwroot/admin.guangyinduidu.com/index.html || grep -qi 'Cache-Control' /www/wwwroot/admin.guangyinduidu.com/index.html
          # 若面板 Nginx 对 html 开了长缓存，部署后立刻刷新 mtime，降低命中旧入口概率
          touch /www/wwwroot/guangyinduidu.com/index.html 2>/dev/null || true
          touch /www/wwwroot/admin.guangyinduidu.com/index.html /www/wwwroot/admin.guangyinduidu.com/admin.html 2>/dev/null || true

          # 客户端更新门禁：version.json 与入口 build 标记
          test -f /www/wwwroot/guangyinduidu.com/version.json
          grep -q 'app-build-id' /www/wwwroot/guangyinduidu.com/index.html
          grep -q 'app-build-id' /www/wwwroot/admin.guangyinduidu.com/index.html
          # 可选：在 server/.env 设置 REQUIRED_CLIENT_BUILD_ID 与 version.json 内 buildId 一致

          # 道具卡文案在 useSocketConnection 等 chunk（非 main 入口）；扫全 assets
          grep -rq '结算页判定' /www/wwwroot/guangyinduidu.com/assets/
          grep -rq '结算页判定' /www/wwwroot/admin.guangyinduidu.com/assets/
          ! grep -rq '盲选' /www/wwwroot/guangyinduidu.com/assets/
          ! grep -rq '盲选' /www/wwwroot/admin.guangyinduidu.com/assets/
          # 主域 index.html 建议 Nginx no-cache，见 docs/nginx-cache-snippet.conf
          
          # 清理压缩包
          rm -f /root/dist_upload.zip
          rm -f /root/server_upload.zip
