name: Deploy to Aliyun BT Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        npm run build
        cd dist
        zip -r ../../dist_upload.zip ./*

    - name: Build Backend
      run: |
        cd server
        npm install
        npm run build
        zip -r ../server_upload.zip dist/* package.json package-lock.json

    - name: Copy files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "dist_upload.zip,server_upload.zip"
        target: "/root"
        overwrite: true

    - name: Execute SSH commands to deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          # 部署前端
          unzip -o /root/dist_upload.zip -d /www/wwwroot/guangyinduidu.com/
          
          # 部署后端
          unzip -o /root/server_upload.zip -d /www/wwwroot/guangyinduidu.com/server/
          cd /www/wwwroot/guangyinduidu.com/server/
          npm install --production
          pm2 restart guangyin
          
          # 清理压缩包
          rm -f /root/dist_upload.zip
          rm -f /root/server_upload.zip
