# 光阴对赌 — 静态资源缓存（主域 guangyinduidu.com 与 admin 子域各贴一份）
# 宝塔：网站 → 设置 → 配置文件，在 server { } 内 include 或粘贴下列 location

# 入口 HTML：每次发版必须拿到最新 script hash
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
}

location = /admin.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
}

# 版本探测：客户端更新门禁
location = /version.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
}

# Vite 带 hash 的静态资源可长期缓存
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}
